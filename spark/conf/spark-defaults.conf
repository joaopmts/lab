# spark-defaults compartilhado entre o cluster Spark (spark-master / spark-worker)
# e o driver que roda dentro do Airflow (SparkSubmitOperator em client mode).

# --- Extensões de formato de tabela ---
spark.sql.extensions                         io.delta.sql.DeltaSparkSessionExtension,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# --- Catálogo de sessão: Delta Lake registrado no Hive Metastore ---
# Tabelas criadas aqui ficam visíveis no Trino pelos catálogos `delta` e `hive`.
spark.sql.catalogImplementation              hive
spark.hadoop.hive.metastore.uris             thrift://metastore:9083
spark.sql.warehouse.dir                      s3a://warehouse/
spark.sql.catalog.spark_catalog              org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- Catálogo `iceberg`: Iceberg no Hive Metastore (mesmo catálogo `iceberg` do Trino) ---
spark.sql.catalog.iceberg                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type               hive
spark.sql.catalog.iceberg.uri                thrift://metastore:9083
spark.sql.catalog.iceberg.warehouse          s3a://warehouse/iceberg

# --- Catálogo `local` (legado): Iceberg tipo hadoop, só no MinIO, sem metastore ---
# Não aparece no Trino. Mantido para compatibilidade com notebooks antigos.
spark.sql.catalog.local                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local.type                 hadoop
spark.sql.catalog.local.warehouse            s3a://bronze/warehouse

spark.sql.defaultCatalog                     spark_catalog
