# Configuração mínima do Airflow para o lab.
#
# A fonte de verdade é o docker-compose.yml (variáveis AIRFLOW__SECAO__CHAVE),
# que sobrescrevem qualquer valor deste arquivo. Executor, banco, auth manager,
# fernet key e segredos de API/JWT vêm de lá (e do .env).
# Aqui ficam apenas ajustes que não são sensíveis.
#
# Referência completa: https://airflow.apache.org/docs/apache-airflow/3.0.4/configurations-ref.html

[core]
dags_folder = /opt/airflow/dags
plugins_folder = /opt/airflow/plugins
default_timezone = utc
load_examples = False
dags_are_paused_at_creation = True
lazy_load_plugins = True

[api]
expose_config = False
expose_stacktrace = False

[api_auth]
jwt_expiration_time = 86400
jwt_cli_expiration_time = 3600

[logging]
base_log_folder = /opt/airflow/logs
